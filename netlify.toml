[build]
  command = "npm run build"
  publish = "dist"

# El service worker NUNCA debe quedar cacheado: si se cachea, los deploys
# nuevos no llegan al dispositivo y la app queda pegada en una versión vieja.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# Los bundles de Vite llevan hash en el nombre: son inmutables.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
